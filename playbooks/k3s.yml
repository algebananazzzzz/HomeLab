---
- name: Install K3s and configure kubectl
  hosts: home
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  vars:
    k3s_version: ""
    k3s_server_args: "--snapshotter=native --write-kubeconfig-mode 644"

  tasks:
    - name: Ensure curl is installed
      ansible.builtin.package:
        name: curl
        state: present

    - name: Check if K3s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      environment:
        INSTALL_K3S_EXEC: "server {{ k3s_server_args }}"
        INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Ensure K3s service is enabled and running
      ansible.builtin.service:
        name: k3s
        enabled: true
        state: started

    - name: Wait for kubeconfig to be created
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: "{{ k3s_kubeconfig_wait_seconds | default(180) }}"
        sleep: 5

    - name: Set system-wide KUBECONFIG for bash
      ansible.builtin.copy:
        dest: /etc/profile.d/kubeconfig.sh
        content: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml\n"
        owner: root
        group: root
        mode: "0644"

    - name: Set KUBECONFIG for SSH user bashrc
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        line: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
        create: true
        mode: "0644"

    - name: Set KUBECONFIG for root bashrc
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        line: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
        create: true
        mode: "0644"

    - name: Set KUBECONFIG for SSH user bash profile
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_profile"
        line: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
        create: true
        mode: "0644"

    - name: Set KUBECONFIG for root bash profile
      ansible.builtin.lineinfile:
        path: /root/.bash_profile
        line: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
        create: true
        mode: "0644"
