---
- name: Install K3s and configure kubectl
  hosts: home
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  vars:
    k3s_version: ""
    k3s_server_args: "--snapshotter=native --write-kubeconfig-mode 644"

  tasks:
    - name: Ensure curl is installed
      ansible.builtin.package:
        name: curl
        state: present

    - name: Check if K3s is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      environment:
        INSTALL_K3S_EXEC: "server {{ k3s_server_args }}"
        INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

    - name: Ensure K3s service is enabled and running
      ansible.builtin.service:
        name: k3s
        enabled: true
        state: started

    - name: Wait for kubeconfig to be created
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: "{{ k3s_kubeconfig_wait_seconds | default(180) }}"
        sleep: 5

    - name: Set system-wide KUBECONFIG for bash
      ansible.builtin.copy:
        dest: /etc/profile.d/kubeconfig.sh
        content: "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml\n"
        owner: root
        group: root
        mode: "0644"

    - name: Set KUBECONFIG for all login sessions
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: '^KUBECONFIG='
        line: 'KUBECONFIG=/etc/rancher/k3s/k3s.yaml'
        create: true
        mode: "0644"

    - name: Patch Traefik to run on host network (single node)
      ansible.builtin.command: >
        kubectl -n kube-system patch deployment traefik
        --type='merge'
        -p '{
          "spec": {
            "template": {
              "spec": {
                "hostNetwork": true,
                "dnsPolicy": "ClusterFirstWithHostNet"
              }
            }
          }
        }'
      register: traefik_patch
      changed_when: "'patched' in traefik_patch.stdout or traefik_patch.rc == 0"
